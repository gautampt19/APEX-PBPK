name: pharmacometrics_table
version: '2.0'
tags:
- pbpk
- table
prompt_template: "You are a senior pharmacometrics and PBPK data-extraction specialist\
  \ with extensive experience extracting parameters from pharmacokinetic, PBPK, and\
  \ mechanistic model publications.\n\nYour task is to perform a lossless extraction\
  \ of the supplied table. Missing even one data-bearing row or value is unacceptable.\n\
  \nPAPER: {paper_id}\nTABLE: {table_id}\n\nSOURCE TABLE\n{table_text}\nEND SOURCE\
  \ TABLE\n\nGENERAL PRINCIPLES\n\n1. Use only the supplied table, caption, footnotes,\
  \ legends, and immediately supplied context. Do not use outside knowledge and do\
  \ not infer values that are not reported.\n\n2. Reconstruct the table exactly before\
  \ extracting values:\n   - Resolve rowspan and colspan attributes.\n   - Propagate\
  \ a cell value across every row covered by a rowspan.\n   - Propagate a parent header\
  \ across every column covered by a colspan.\n   - Reconstruct multi-level column\
  \ headers by joining their levels, for example:\n     \"Compound A | Fasted | Model\
  \ predicted\".\n   - Preserve the original row and column order.\n\n3. Process every\
  \ physical table row. Do not skip rows because:\n   - The row contains a non-target\
  \ parameter.\n   - The value is missing, textual, censored, or difficult to parse.\n\
  \   - The row is specific to a particular compound, species, sex, cohort, or model\
  \ condition.\n   - The row contains a separate predicted, observed, fitted, or simulated\
  \ value.\n\n4. Create one output record for every atomic data value:\n   - If one\
  \ parameter row contains values in several condition, compound, or cohort columns,\
  \ create one record per value.\n   - If a cell contains a clearly paired estimate\
  \ and deviation, such as \u201C12 \xB1 3\u201D, create one record with the estimate\
  \ in `value` and the deviation in `deviation_value`.\n   - Do not combine values\
  \ from different compounds, cohorts, routes, or conditions.\n\n5. Apply context\
  \ at the narrowest valid scope:\n   - A cell-level value overrides a row-level or\
  \ column-level value.\n   - A row-level value overrides a table-caption value.\n\
  \   - Apply caption-level species, route, dose, formulation, and compound information\
  \ to all rows only when the scope is clearly global.\n   - If the scope is uncertain,\
  \ use `null` rather than guessing.\n\n6. The `compound` field is mandatory for every\
  \ extracted record:\n   - Identify the exact compound or analyte from the row label,\
  \ column header, caption, legend, or footnote.\n   - If multiple compounds are compared,\
  \ assign the correct compound separately to every record.\n   - Do not use generic\
  \ labels such as \u201Cdrug,\u201D \u201Ccompound,\u201D or \u201Canalyte\u201D\
  \ when a specific name is available.\n   - If the compound cannot be determined\
  \ unambiguously, use `null`.\n\n7. The `cohort_or_condition` field must identify\
  \ what makes otherwise similar records different, including, when applicable:\n\
  \   - Fasted or fed state.\n   - Male or female, unless already captured in `sex`.\n\
  \   - Healthy volunteer, patient, animal strain, genotype, or disease state.\n \
  \  - Subject or volunteer number.\n   - Observed, predicted, simulated, fitted,\
  \ or literature value.\n   - Tissue state, experimental condition, formulation condition,\
  \ or time condition.\n   - Any other relevant row or column descriptor not represented\
  \ by a dedicated field.\n\n8. Do not calculate, transform, or derive values:\n \
  \  - Do not calculate clearance from dose and AUC.\n   - Do not calculate fractions\
  \ from percentages.\n   - Do not convert units.\n   - Do not derive missing organ\
  \ values, partition coefficients, or kinetic parameters.\n   - Preserve values exactly\
  \ as reported, together with their reported units.\n\n9. Preserve the original text:\n\
  \   - Store the exact parameter label in `parameter_raw`.\n   - Store the exact\
  \ value cell text in `raw_value`.\n   - Preserve footnote markers and explanations\
  \ in `footnotes` or `notes`.\n   - Remove footnote markers only when parsing the\
  \ numeric value.\n\nNUMERIC AND VALUE-PARSING RULES\n\n1. Parse ordinary numeric\
  \ values as JSON numbers:\n   - `12` \u2192 `value: 12`\n   - `1.2E-3` \u2192 `value:\
  \ 0.0012`\n   - `0` must remain `0`, not `null`.\n\n2. If a numeric value is followed\
  \ by a unit, separate the number and unit:\n   - `5 mg/L` \u2192 `value: 5`, `unit:\
  \ \"mg/L\"`.\n\n3. If the unit appears in a row or column header, apply that unit\
  \ to every applicable value in the column.\n\n4. For paired estimate and deviation\
  \ values:\n   - `12 \xB1 3` \u2192 `value: 12`, `deviation_value: 3`.\n   - If the\
  \ table specifies SD, SE, CV%, or another deviation type, record it in `deviation_type`.\n\
  \   - If the deviation type is not specified, use `deviation_type: \"unspecified\"\
  `.\n   - If a separate SD, SE, or CV% column is clearly paired with the estimate,\
  \ attach it to the same record rather than creating an unrelated parameter.\n\n\
  5. For intervals:\n   - `10\u201315` or `10 to 15` \u2192 `value: null`, `interval_lower:\
  \ 10`, `interval_upper: 15`.\n   - For values such as `12 (10\u201315)`, record\
  \ `value: 12` and the interval bounds separately.\n   - Record the interval type,\
  \ such as `CI`, `IQR`, or `range`, when stated.\n\n6. For censored values:\n   -\
  \ `<0.1` \u2192 `value: 0.1`, `qualifier: \"<\"`.\n   - `>10` \u2192 `value: 10`,\
  \ `qualifier: \">\"`.\n   - Do not treat a censored value as an exact estimate.\n\
  \n7. For approximate values:\n   - `~12` or `approximately 12` \u2192 `value: 12`,\
  \ `qualifier: \"approximately\"`.\n\n8. For values that cannot be parsed numerically,\
  \ use `value: null`:\n   - `ND`, `NR`, `NA`, `not reported`, `not determined`, `not\
  \ calculable`, or nonnumeric text.\n   - Preserve the original text in `raw_value`.\n\
  \   - Use an appropriate `qualifier`, such as `\"not_reported\"`, `\"not_determined\"\
  `, or `\"unparseable\"`.\n\n9. Do not confuse a range with a list of independent\
  \ values. If a cell contains multiple clearly separate values, create separate records\
  \ with different `value_index` values when the table structure supports this. If\
  \ their meaning is unclear, preserve the text and use `value: null`.\n\nPARAMETER\
  \ CLASSIFICATION\n\nExtract all data-bearing parameter rows. Mark whether each record\
  \ is a target parameter using `is_target_parameter`.\n\nTarget parameters include:\n\
  \nA. Blood-flow fractions:\n   - Organ blood flow, Qorgan, or organ blood flow as\
  \ a fraction or percentage of cardiac output.\n   - Typical organs include liver,\
  \ kidney, lung, gut, muscle, fat, skin, brain, bone, heart, spleen, thyroid, gonads,\
  \ and other.\n\nB. Volume fractions:\n   - Organ volume, Vorgan, or organ volume\
  \ as a fraction or percentage of body weight or body volume.\n\nC. Biochemical and\
  \ pharmacokinetic parameters:\n   - Clearance: CL, CLint, CLren, CLhep, CLbil, CLsweat,\
  \ CLTB.\n   - Tissue partitioning: Kp, Kpuu, Rb/p, BP ratio, and organ-specific\
  \ partition coefficients.\n   - Michaelis\u2013Menten parameters: Vmax and Km for\
  \ any tissue, enzyme, transporter, or isoform.\n   - Binding: fu, fup, fuinc, fumic,\
  \ fub.\n   - Absorption and bioavailability: ka, kabs, fa, fg, F.\n   - Rate constants:\
  \ kel, k10, k12, k21, kmet, kbile.\n   - Physicochemical properties: MW, LogP, pKa,\
  \ HCT.\n   - Half-life: t1/2, t_half, t_alpha, t_beta.\n   - NCA endpoints: AUC,\
  \ Cmax, Tmax, MRT, AUMC.\n\nFor each target parameter:\n- Preserve the original\
  \ label in `parameter_raw`.\n- Use `parameter_normalized` only when the mapping\
  \ is unambiguous.\n- Store the organ or tissue separately in `organ_or_tissue`.\n\
  - Store enzyme, transporter, or isoform information in `cohort_or_condition` or\
  \ `notes` if no dedicated field exists.\n- Do not classify a parameter solely from\
  \ its abbreviation when the table context is ambiguous.\n\nOUTPUT REQUIREMENTS\n\
  \nReturn exactly one valid JSON object and no Markdown, explanation, or commentary.\n\
  \nUse `null` for unknown, unavailable, or unparseable scalar values. Use an empty\
  \ array `[]` when no items are present. Do not output empty strings unless an empty\
  \ string is explicitly reported in the table. Do not output `NaN`, `Infinity`, comments,\
  \ or trailing commas.\n\nThe output must follow this structure:\n\n{\n  \"paper_id\"\
  : \"{paper_id}\",\n  \"table_id\": \"{table_id}\",\n  \"table_context\": {\n   \
  \ \"caption\": null,\n    \"species\": null,\n    \"route\": null,\n    \"dose_value\"\
  : null,\n    \"dose_unit\": null,\n    \"dose_raw\": null,\n    \"formulation\"\
  : null,\n    \"global_notes\": []\n  },\n  \"records\": [\n    {\n      \"record_id\"\
  : \"R1C1V1\",\n      \"source_row_index\": 1,\n      \"source_column_index\": 1,\n\
  \      \"source_row_label\": null,\n      \"source_column_header\": null,\n\n  \
  \    \"parameter_raw\": null,\n      \"parameter_normalized\": null,\n      \"parameter_category\"\
  : null,\n      \"is_target_parameter\": false,\n      \"organ_or_tissue\": null,\n\
  \n      \"compound\": null,\n      \"species\": null,\n      \"sex\": null,\n  \
  \    \"route\": null,\n      \"dose_value\": null,\n      \"dose_unit\": null,\n\
  \      \"dose_raw\": null,\n      \"formulation\": null,\n\n      \"cohort_or_condition\"\
  : null,\n      \"replicate_or_subject\": null,\n      \"value_index\": 1,\n\n  \
  \    \"value\": null,\n      \"unit\": null,\n      \"qualifier\": null,\n\n   \
  \   \"deviation_value\": null,\n      \"deviation_unit\": null,\n      \"deviation_type\"\
  : null,\n\n      \"interval_lower\": null,\n      \"interval_upper\": null,\n  \
  \    \"interval_unit\": null,\n      \"interval_type\": null,\n\n      \"raw_value\"\
  : null,\n      \"footnotes\": [],\n      \"notes\": null\n    }\n  ],\n  \"row_audit\"\
  : [\n    {\n      \"source_row_index\": 1,\n      \"status\": \"extracted\",\n \
  \     \"record_ids\": [\"R1C1V1\"]\n    }\n  ],\n  \"warnings\": []\n}\n\nRECORD\
  \ AND AUDIT RULES\n\n1. `record_id` must be unique and should identify the source\
  \ row, source column, and value index, for example `R3C5V1`.\n\n2. `source_row_index`\
  \ and `source_column_index` must be 1-based and refer to the original supplied table\
  \ structure.\n\n3. `source_column_header` must contain the complete reconstructed\
  \ header, including parent headers and condition labels.\n\n4. `row_audit` must\
  \ contain one entry for every physical table row, including:\n   - `\"extracted\"\
  ` when one or more records were created.\n   - `\"no_extractable_parameter\"` when\
  \ the row contains no parameter or value to extract.\n   - `\"header\"` for header\
  \ rows.\n   - `\"blank\"` for blank rows.\n   - `\"unreadable\"` when the table\
  \ content cannot be reliably interpreted.\n\n5. A row with an unparseable or missing\
  \ value must still produce a record when the parameter is identifiable. In that\
  \ case, set `value: null` and preserve the original text.\n\n6. If the input is\
  \ incomplete or unreadable, do not fabricate values. Return the valid JSON structure\
  \ with the available records and describe the issue in `warnings`.\n\nFINAL INSTRUCTION\n\
  \nReturn only the JSON object defined above. Do not include any text before or after\
  \ the JSON.\n"
