<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-PBPK — Database Viewer</title>
    <!-- Google Fonts for Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="db-viewer-body">

    <div class="db-background">
        <!-- Subtle gradient background elements for dynamic look -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="db-container">
        <header class="glass-header">
            <div class="header-left">
                <h1><span class="gradient-text">APEX-PBPK</span> Database</h1>
            </div>
            <div class="header-right">
                <a href="/" class="glass-btn">← Back to Extractor</a>
            </div>
        </header>

        <div class="db-split-layout">
            <!-- Sidebar -->
            <div class="glass-sidebar">
                <div class="sidebar-top">
                    <h3>Extracted Papers</h3>
                    <div class="search-box">
                        <input type="text" id="paper-search" placeholder="Search papers..." oninput="filterPapers()">
                    </div>
                </div>
                <div id="papers-list" class="scroll-container">
                    <div class="loader-container">
                        <div class="fancy-loader"></div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="glass-main">
                <div class="main-header-info" id="main-header" style="display: none;">
                    <div>
                        <h2 id="doc-title">Select a paper</h2>
                        <p id="doc-meta"></p>
                    </div>
                    <div class="stats-badge" id="param-count-badge"></div>
                </div>
                
                <div class="table-glass-container" id="table-container">
                    <div class="empty-state-elegant">
                        <div class="empty-icon">📊</div>
                        <p>Select a paper from the sidebar to view extracted parameters.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store papers globally for search filtering
        let globalPapers = [];

        function _sourcePassBadge(sp) {
            const map = {
                'xml_table':          ['badge-green',  'XML Table'],
                'colpali_page':       ['badge-orange', 'Visual / ColPali'],
                'prose_pass':         ['badge-purple', 'Prose'],
                'pubchem_enrichment': ['badge-blue',   'PubChem / DB'],
                'chembl_enrichment':  ['badge-pink',   'ChEMBL'],
                'autopk_table':       ['badge-cyan',   'AutoPK Table']
            };
            const [cls, label] = map[sp] || ['badge-gray', sp || 'unknown'];
            return `<span class="modern-badge ${cls}">${label}</span>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchPapers();
        });

        async function fetchPapers() {
            try {
                const res = await fetch('/api/db/papers');
                const data = await res.json();
                globalPapers = data.papers || [];
                renderPapersList(globalPapers);
            } catch (err) {
                document.getElementById('papers-list').innerHTML = `<div class="error-msg">Error loading papers: ${err.message}</div>`;
            }
        }

        function filterPapers() {
            const query = document.getElementById('paper-search').value.toLowerCase();
            const filtered = globalPapers.filter(p => 
                (p.title && p.title.toLowerCase().includes(query)) || 
                (p.paper_id && p.paper_id.toLowerCase().includes(query))
            );
            renderPapersList(filtered);
        }

        function renderPapersList(papers) {
            const list = document.getElementById('papers-list');
            if (papers.length === 0) {
                list.innerHTML = '<div class="empty-msg">No papers found.</div>';
                return;
            }
            
            list.innerHTML = '';
            papers.forEach(p => {
                const el = document.createElement('div');
                el.className = 'glass-paper-item';
                
                const title = p.title || p.paper_id;
                
                el.innerHTML = `
                    <div class="p-title">${title}</div>
                    <div class="p-id">${p.paper_id}</div>
                `;
                
                el.onclick = () => {
                    document.querySelectorAll('.glass-paper-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    window.__selectedPaperId__ = p.paper_id;
                    fetchParameters(p.paper_id);
                };
                
                list.appendChild(el);
            });
        }

        function _safe(val) {
            return (val === null || val === undefined || val === '') ? '-' : val;
        }

        async function fetchParameters(paperId) {
            const container = document.getElementById('table-container');
            const header = document.getElementById('main-header');
            
            container.innerHTML = '<div class="loader-container"><div class="fancy-loader"></div></div>';
            
            try {
                const res = await fetch(`/api/db/parameters/${paperId}`);
                const data = await res.json();
                
                header.style.display = 'flex';
                document.getElementById('doc-title').textContent = data.document?.title || paperId;
                
                let dateStr = 'Unknown';
                if (data.document?.created_at) {
                    dateStr = new Date(data.document.created_at).toLocaleString();
                }
                document.getElementById('doc-meta').textContent = `Processed on ${dateStr}`;
                document.getElementById('param-count-badge').textContent = `${data.parameters.length} params`;
                
                if (data.parameters.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state-elegant">
                            <div class="empty-icon">📭</div>
                            <p>No parameters extracted for this paper.</p>
                        </div>`;
                    return;
                }
                
                let html = `
                    <div style="text-align:right; margin-bottom:12px;">
                    <button id="create-r-model-btn" onclick="createRModel()" style="
                      display:inline-flex; align-items:center; gap:7px;
                      background: linear-gradient(135deg, #6366f1, #4f46e5);
                      color:#fff; border:none; border-radius:9px;
                      padding:10px 20px; font-size:0.88rem; font-weight:700;
                      cursor:pointer;
                      box-shadow: 0 4px 15px rgba(99,102,241,.4);
                      transition: all .2s;
                    ">🚀 Create R Model</button>
                  </div>
                  <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Canonical Name (PBPKO)</th>
                                <th>Parameter Name</th>
                                <th>Value</th>
                                <th>Unit</th>
                                <th>Species</th>
                                <th>Dose</th>
                                <th>Route</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                data.parameters.forEach(p => {
                    let canonName = '-';
                    let pbpkoId = '-';
                    let pbpkoHtml = '-';
                    
                    if (p.canonical_name) {
                        try {
                            const parsed = JSON.parse(p.canonical_name);
                            canonName = parsed.canonical_name || '-';
                            pbpkoId = parsed.pbpko_id || '-';
                        } catch(e) {
                            canonName = p.canonical_name; // fallback if it's just a string
                        }
                    }
                    
                    if (canonName !== '-') {
                        pbpkoHtml = `
                            <div style="font-weight:600; color:#38bdf8; margin-bottom:2px;">${canonName}</div>
                            <div style="font-size:0.75rem; color:var(--db-muted); font-family:monospace;">${pbpkoId}</div>
                        `;
                    }
                    
                    const rawParam = _safe(p.parameter_name);
                    const val = _safe(p.value);
                    const dev = p.deviation_value ? `±${p.deviation_value}` : '';
                    const unit = _safe(p.unit);
                    
                    const dose = p.dose ? `${p.dose}` : '-';
                    
                    html += `
                        <tr class="fade-in-row">
                            <td class="td-norm">${pbpkoHtml}</td>
                            <td class="td-raw">${rawParam}</td>
                            <td class="td-value"><span class="val-num">${val}</span> <span class="val-dev">${dev}</span></td>
                            <td class="td-unit">${unit}</td>
                            <td>${p.species ? '<span class="species-badge">' + p.species + '</span>' : '-'}</td>
                            <td class="td-dose">${dose}</td>
                            <td class="td-route">${_safe(p.route)}</td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table>`;
                container.innerHTML = html;
                
            } catch (err) {
                container.innerHTML = `<div class="error-msg">Error loading parameters: ${err.message}</div>`;
            }
        }

        function createRModel() {
            const selectedPaper = window.__selectedPaperId__;
            if (!selectedPaper) {
                alert('Please select a paper from the list first.');
                return;
            }
            const btn = document.getElementById('create-r-model-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '⏳ Preparing…';
                btn.style.opacity = '0.7';
            }
            window.location.href = '/model-staging?paper_id=' + encodeURIComponent(selectedPaper);
        }
    </script>
</body>
</html>
